services:
  omniread:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniread:latest
    container_name: omniread
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-1.3}
      - CONCURRENCY=${CONCURRENCY:-6}
      - MAX_RETRIES=${MAX_RETRIES:-4}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - omniread_data:/app/backend/data

volumes:
  omniread_data:
    driver: local
